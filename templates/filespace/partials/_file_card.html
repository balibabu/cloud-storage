<div class="bg-white p-4 rounded-lg shadow-sm border flex flex-col justify-between group">

    <div class="flex items-start space-x-3 mb-3">
        <svg class="w-8 h-8 text-blue-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z">
            </path>
        </svg>

        <div class="overflow-hidden">
            <p class="font-medium text-gray-700 text-sm truncate" title="{{ userfile.file.title }}">
                {{ userfile.file.title }}
            </p>
            <p class="text-xs text-gray-400">
                {{ userfile.file.size|filesizeformat }}
            </p>
        </div>
    </div>

    <div class="flex items-center justify-between mt-auto">

        {% if userfile.file.status == 'COMPLETED' %}
            <span class="px-2 py-1 bg-green-100 text-green-700 text-[10px] rounded-full font-bold">COMPLETED</span>
        {% elif userfile.file.status == 'FAILED' %}
            <span class="px-2 py-1 bg-red-100 text-red-700 text-[10px] rounded-full font-bold">FAILED</span>
        {% else %}
            <span class="px-2 py-1 bg-yellow-100 text-yellow-700 text-[10px] rounded-full font-bold">
                {{ userfile.file.status }}
            </span>
        {% endif %}

        <a href="{% url 'filespace:download_file' userfile.id %}" 
           class="text-blue-600 hover:text-blue-800 p-1 bg-blue-50 rounded">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4">
                </path>
            </svg>
        </a>

    </div>
</div>
