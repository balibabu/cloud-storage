{% extends 'filespace/base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-lg border border-gray-100 mt-10">
    <h2 class="text-2xl font-bold mb-6 text-gray-800 text-center">Welcome Back</h2>
    
    <form method="post" class="space-y-5">
        {% csrf_token %}
        
        <!-- Username Field -->
        <div>
            <label for="{{ form.username.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">
                Username
            </label>
            <input 
                type="text" 
                name="{{ form.username.name }}" 
                id="{{ form.username.id_for_label }}"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                placeholder="Enter your username"
                required
            >
            {% if form.username.errors %}
                <p class="text-red-500 text-xs mt-1">{{ form.username.errors.0 }}</p>
            {% endif %}
        </div>

        <!-- Password Field -->
        <div>
            <label for="{{ form.password.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">
                Password
            </label>
            <input 
                type="password" 
                name="{{ form.password.name }}" 
                id="{{ form.password.id_for_label }}"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                placeholder="••••••••"
                required
            >
            {% if form.password.errors %}
                <p class="text-red-500 text-xs mt-1">{{ form.password.errors.0 }}</p>
            {% endif %}
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md">
            Sign In
        </button>
    </form>

    <div class="mt-6 text-center border-t pt-4">
        <p class="text-sm text-gray-600">
            Don't have an account? 
            <a href="{% url 'accounts:register' %}" class="text-blue-600 font-medium hover:underline">Create account</a>
        </p>
    </div>
</div>
{% endblock %}
